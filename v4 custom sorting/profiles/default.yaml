# Default profile loaded automatically by custom_sortingv4 on startup.
# Copy to ~/jetarm_v4_profiles/default.yaml on the Jetson (or click
# "SAVE AS DEFAULT" in the tuner UI to overwrite it from current state).
#
# Format is the standard ROS2 params YAML so it can also be passed to the
# launch file via parameters=[...] / --params-file.

/**:
  ros__parameters:
    # Detection
    engine_path: /home/ubuntu/third_party_ros2/data/best_scaff2.engine
    min_object_area: 500
    max_object_area: 7000
    lock_distance_thresh: 0.005
    count_still_threshold: 4
    count_move_threshold: 8
    detection_avg_frames: 3

    # Motion
    motion_speed: 1.5
    aggression: 1.3
    hover_height: 0.06
    approach_dwell: 0.1
    parallel_base_motion: true

    # Gripping
    gripper_open_pulse: 200
    gripper_close_pulse: 540
    gripper_full_closed_pulse: 700
    gripper_slack: 25
    gripper_close_duration: 0.35
    gripper_step_pulse: 30

    # Retries / safety
    max_pick_retries: 3
    vision_confirm_pick: true
    servo_feedback_enabled: true

    # Self-calibration
    startup_self_calibrate: true
    place_bin_color_check: true

    # Inference
    inference_warmup: true
    hot_log_inference_ms: false

    # Per-target overrides as JSON. Empty by default. Example:
    # target_overrides: '{"scaff": {"motion_speed": 0.9}, "blue": {"motion_speed": 1.8}}'
    target_overrides: '{}'
