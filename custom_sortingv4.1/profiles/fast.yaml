# Fast & aggressive: quicker arm phases, shorter (but still present)
# jaw-clamp settle. Load via the tuner UI Profiles tab or
# `launch_v4.1.sh` -> profile prompt.
/**:
  ros__parameters:
    motion_speed: 2.1
    aggression: 1.7
    gripper_close_duration: 0.25
    gripper_settle: 0.3
    count_still_threshold: 3
    count_move_threshold: 6
    hover_height: 0.05
    approach_dwell: 0.05
