# Default profile loaded automatically by custom_sortingv4_1 on startup.
# install.sh seeds this to ~/jetarm_v4_profiles/default.yaml (or click
# "SAVE AS DEFAULT" in the tuner UI to overwrite it from current state).
#
# Format is the standard ROS2 params YAML so it can also be passed to the
# launch file via parameters=[...] / --params-file.
#
# Round 15: the retry-era knobs (max_pick_retries, vision_confirm_pick,
# servo_feedback_enabled, gripper_full_closed_pulse, gripper_slack,
# gripper_step_pulse) are gone - pick is one-shot. gripper_settle and
# grab_depth replace them as the grip-reliability knobs.

/**:
  ros__parameters:
    # Detection
    engine_path: /home/ubuntu/third_party_ros2/data/best_scaff2.engine
    min_object_area: 500
    max_object_area: 7000
    lock_distance_thresh: 0.005
    count_still_threshold: 4
    count_move_threshold: 8
    detection_avg_frames: 3

    # YOLO runtime knobs (apply instantly while STOPPED; queued while RUNNING)
    yolo_conf_thresh: 0.25
    yolo_iou_thresh: 0.7
    yolo_max_det: 100
    inference_max_hz: 0.0

    # Motion
    motion_speed: 1.5
    aggression: 1.3
    hover_height: 0.06
    approach_dwell: 0.1
    parallel_base_motion: true

    # Gripping (one-shot pick: hover -> align -> descend -> close -> settle -> lift)
    gripper_open_pulse: 200
    gripper_close_pulse: 540
    gripper_close_duration: 0.35
    gripper_settle: 0.5
    grab_depth: 0.02

    # Self-calibration
    startup_self_calibrate: true
    place_bin_color_check: true

    # Inference
    inference_warmup: true
    hot_log_inference_ms: false

    # Per-target overrides as JSON. Empty by default. Example:
    # target_overrides: '{"scaff": {"motion_speed": 0.9, "gripper_settle": 0.8}}'
    target_overrides: '{}'
